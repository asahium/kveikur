name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Test
        run: swift test
      - name: Build DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}" BUILD="${{ github.run_number }}" ./scripts/dmg.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/Kveikur-*.dmg \
            --title "Kveikur ${GITHUB_REF_NAME#v}" --generate-notes
