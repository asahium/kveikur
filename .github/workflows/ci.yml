name: CI

on:
  push:
    branches: [main]
    paths: ["Sources/**", "Tests/**", "iOS/**", "Package.swift", "scripts/**", ".github/workflows/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
          swift --version
      - name: Test
        run: swift test
      - name: Bundle macOS app
        run: ./scripts/bundle.sh release
      - name: Build iOS app (simulator, unsigned)
        run: |
          brew install xcodegen
          cd iOS && xcodegen generate --quiet
          xcodebuild -project KveikurMobile.xcodeproj -scheme KveikurMobile \
            -destination 'generic/platform=iOS Simulator' -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build -quiet
